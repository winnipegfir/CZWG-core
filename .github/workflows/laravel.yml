name: Laravel

on:
  pull_request:
    branches:
      - master
      - development

permissions:
  contents: read

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: czwg_testing
          MYSQL_USER: czwg_ci
          MYSQL_PASSWORD: ci_test_only
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3307'
      DB_DATABASE: czwg_testing
      DB_USERNAME: czwg_ci
      DB_PASSWORD: ci_test_only
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, dom, xml, curl, fileinfo
          coverage: none

      - name: Copy test environment
        run: cp .env.example .env

      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Prepare application
        run: |
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/logs bootstrap/cache
          chmod -R u+rwX storage bootstrap/cache
          php artisan config:clear
          php artisan key:generate

      - name: Configure PHPUnit for temporary MySQL
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          tree = ET.parse("phpunit.xml")
          settings = tree.getroot().find("php")
          if settings is None:
              settings = ET.SubElement(tree.getroot(), "php")

          names = [
              "DB_CONNECTION", "DB_HOST", "DB_PORT",
              "DB_DATABASE", "DB_USERNAME", "DB_PASSWORD"
          ]
          for name in names:
              for element in list(settings):
                  if element.get("name") == name:
                      settings.remove(element)
              ET.SubElement(settings, "server", {
                  "name": name,
                  "value": os.environ[name],
                  "force": "true"
              })

          tree.write("phpunit.ci.xml", encoding="utf-8", xml_declaration=True)
          PY

      - name: Run migrations and seed test database
        run: php artisan migrate --seed --no-interaction

      - name: Execute PHPUnit tests
        run: vendor/bin/phpunit --configuration phpunit.ci.xml

      - name: Show Laravel Log
        if: ${{ failure() }}
        run: |
          for logfile in storage/logs/laravel*.log; do
            if [ -f "$logfile" ]; then
              cat "$logfile"
            fi
          done
